name: plantly_inventory
description: "PlantlyInventory — offline-first companion plant care tracker. Phase 1 Flutter app; see PLAN.md."
publish_to: 'none'
version: 1.1.0+18

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State + routing (per PLAN.md §"Package list")
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Lightweight prefs — for UI state (layout, theme). Drift handles the
  # domain data; prefs are just for per-install UI choices.
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

  # Phase-1 data layer — Drift (SQLite) + HLC + op-log (PLAN.md §"Schema
  # non-negotiables"). Each synced entity carries id/tenant_id/updated_hlc/
  # deleted_at/device_id and every write emits an entry in sync_ops.
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  ulid: ^2.0.0
  crypto: ^3.0.5    # photo content-addressing (sha256)
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # i18n — en + ro from day 1, per PLAN.md.
  flutter_localizations:
    sdk: flutter
  # Web: path URLs (`/plants/<id>`) instead of `/#/...` — see lib/app/url_strategy.dart.
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2

  # Local reminders. DST-safe via timezone. Plugin registers POST_NOTIFICATIONS
  # + SCHEDULE_EXACT_ALARM itself on Android; iOS requests permission via
  # UNNotificationCenter.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # ZIP-with-photos export (Phase 1). Pure-Dart; already pulled in via
  # flutter_local_notifications → xml → archive is a different lib.
  archive: ^4.0.0

  # Opt-in crash reporting + anonymous usage events. Initialised only
  # when the user explicitly flips the toggle in Me → Privacy & data
  # (both default off). Without a DSN (SENTRY_DSN env var at build
  # time), init is a no-op — the app ships public with zero telemetry
  # by default.
  sentry_flutter: ^9.0.0

  # User-facing backup / restore + iCal save-to-file. file_selector for
  # picking a backup JSON/ZIP to import; share_plus for handing the
  # exported bytes to whatever the OS considers "share" (Files, Drive,
  # Messages, email attachment, …).
  file_selector: ^1.0.3
  share_plus: ^12.0.0

  # Web build only: IndexedDB photo store + anchor-click downloads
  # (lib/**/*_web.dart behind conditional imports). Already transitive
  # via drift/sqlite3; listed so the direct imports are legal.
  web: ^1.1.1
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.3.4
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
  # test/flutter_test_config.dart overrides sqlite3 lookup path on Linux
  sqlite3: ^2.4.7
  # Generates launcher icons (legacy + Android adaptive) from assets/launcher.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  # Official Google Play badges (RO + EN) for the web access gate's
  # "prefer your phone?" card. Downloaded unmodified from
  # https://play.google.com/intl/en_us/badges/ — never recolour or crop
  # them; keep clear space ≥ 1/4 of the badge height around them.
  assets:
    - assets/badges/

  # Typography — Inter + Plus Jakarta Sans (the prototype's two families),
  # bundled so release builds never fetch from fonts.gstatic.com (privacy
  # issue #12). Static instances cut from the Google Fonts variable TTFs
  # (github.com/google/fonts, ofl/inter + ofl/plusjakartasans) at the
  # weights the UI actually uses; SIL OFL 1.1, licences alongside.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Launcher icon generation. Source art lives in assets/launcher/ (derived
# from the plantly.ro marketplace mark: leaf-on-green base + a white
# inventory-box emblem on a darker-green chip). Background green #3D7A5F is
# --botanical-500 from the design system; the foreground PNG keeps the emblem
# inside the adaptive safe-zone so round/circle masks never clip the box.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/icon.png"
  adaptive_icon_background: "#3D7A5F"
  # Use the full edge-to-edge mark as the adaptive foreground (NOT the
  # pre-margined icon_foreground.png): flutter_launcher_icons already applies
  # a 16% safe-zone inset, so a pre-margined source double-insets and renders
  # the emblem tiny. The full mark keeps the box emblem inside the inscribed
  # circle, so circle/round masks don't clip it.
  adaptive_icon_foreground: "assets/launcher/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/icon.png"
    background_color: "#3D7A5F"
    theme_color: "#3D7A5F"
