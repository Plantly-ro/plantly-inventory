# Heap sized for the shared CI runner CT (two Flutter projects build there);
# 8G+4G per daemon made concurrent builds thrash and hang for an hour.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Some Flutter plugins ship Java at JVM 11 while their Kotlin compiles at 17;
# the 11/17 bytecode is runtime-compatible, so downgrade JVM-target validation
# from error to warning instead of failing the release build.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2G
