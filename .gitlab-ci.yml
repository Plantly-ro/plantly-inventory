# .gitlab-ci.yml — PlantlyInventory
#
# Three stages run on every push and MR:
#   analyze → test → build-web
#
# Flutter image: ghcr.io/cirruslabs/flutter:stable (pinned via FLUTTER_IMAGE).
# Runs on the group runner `tisa15-ct-gitlab-runner-1 (group runner, plantly-inventory)`.
#
# Followups Lazarus left for later:
#  - dart format enforcement — left out of analyze for now because 90/100 of the
#    existing files don't match dart-format defaults. Add `dart format --set-exit-if-changed .`
#    here after a one-time `dart format .` pass on the repo.
#  - JS prototype Playwright tests (npm install && npm test) — separate job with a Node image.
#  - build-android / build-ios — needs runners with the right SDKs (no macOS runner for ios yet).
#  - container registry image build (registry.urundead.win/plantly-inventory/app) — wire when there's a deploy target.

stages:
  - analyze
  - test
  - build
  - publish

variables:
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  PLAY_PACKAGE: "ro.plantly.inventory"

default:
  image: $FLUTTER_IMAGE
  before_script:
    - flutter --version
    - flutter pub get

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

analyze:
  stage: analyze
  script:
    - flutter analyze

test:
  stage: test
  script:
    - flutter test --machine --reporter=expanded
  artifacts:
    when: always
    reports:
      junit: build/test-results/*.xml
    expire_in: 1 week

build-web:
  stage: build
  script:
    - flutter build web --release
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

# Manual: build a signed AAB and upload it to the Play internal-testing track.
# Requires these protected CI/CD variables (set on the project):
#   PLAY_SA_JSON             (file)  play-publisher-inventory SA key
#   PLAY_UPLOAD_KEYSTORE_B64 (var)   base64 of the upload keystore (.jks)
#   PLAY_KEYSTORE_PASSWORD   (var)   keystore password
#   PLAY_KEY_PASSWORD        (var)   key password
# The Play Console app for $PLAY_PACKAGE must exist and have the SA granted.
publish-internal-android:
  stage: publish
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  script:
    - echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/android/upload.jks"
    - |
      cat > "$CI_PROJECT_DIR/android/key.properties" <<EOF
      storeFile=$CI_PROJECT_DIR/android/upload.jks
      storePassword=$PLAY_KEYSTORE_PASSWORD
      keyPassword=$PLAY_KEY_PASSWORD
      keyAlias=upload
      EOF
    - flutter build appbundle --release
    - python3 -m pip install --quiet --break-system-packages google-api-python-client google-auth
    - python3 tool/play_upload.py --package "$PLAY_PACKAGE" --aab build/app/outputs/bundle/release/app-release.aab --credentials "$PLAY_SA_JSON" --track internal
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 1 week