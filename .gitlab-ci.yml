# .gitlab-ci.yml — PlantlyInventory
#
# Three stages run on every push and MR:
#   analyze → test → build-web
#
# Flutter image: ghcr.io/cirruslabs/flutter:stable (pinned via FLUTTER_IMAGE).
# Runs on the group runner `tisa15-ct-gitlab-runner-1 (group runner, plantly-inventory)`.
#
# Followups Lazarus left for later:
#  - dart format enforcement — left out of analyze for now because 90/100 of the
#    existing files don't match dart-format defaults. Add `dart format --set-exit-if-changed .`
#    here after a one-time `dart format .` pass on the repo.
#  - JS prototype Playwright tests (npm install && npm test) — separate job with a Node image.
#  - build-android / build-ios — needs runners with the right SDKs (no macOS runner for ios yet).
#  - container registry image build (registry.urundead.win/plantly-inventory/app) — wire when there's a deploy target.

stages:
  - analyze
  - test
  - build
  - publish

variables:
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  PLAY_PACKAGE: "ro.plantly.inventory"

default:
  image: $FLUTTER_IMAGE
  before_script:
    - flutter --version
    - flutter pub get

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

analyze:
  stage: analyze
  script:
    # non-fatal on infos (e.g. framework deprecations like onReorder) so they
    # don't block delivery; warnings and errors still fail the job.
    - flutter analyze --no-fatal-infos

test:
  stage: test
  script:
    - flutter test --machine --reporter=expanded
  artifacts:
    when: always
    reports:
      junit: build/test-results/*.xml
    expire_in: 1 week

build-web:
  stage: build
  script:
    - flutter build web --release
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

# ─── Play delivery ──────────────────────────────────────────────────────────
# Automated CD: development → internal testing, main → production.
# Both build a signed AAB and upload it via the Android Publisher API. The
# versionCode is the (globally increasing) pipeline id, so every release
# auto-increments without a manual pubspec bump; versionName stays from pubspec.
#
# Requires these PROTECTED CI/CD variables (set on the project) and PROTECTED
# development + main branches so they are only exposed to those pipelines:
#   PLAY_SA_JSON             (file)  play-publisher-inventory SA key
#   PLAY_UPLOAD_KEYSTORE_B64 (var)   base64 of the upload keystore (.jks)
#   PLAY_KEYSTORE_PASSWORD   (var)   keystore password
#   PLAY_KEY_PASSWORD        (var)   key password
.play-publish:
  stage: publish
  script:
    - echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/android/upload.jks"
    - |
      cat > "$CI_PROJECT_DIR/android/key.properties" <<EOF
      storeFile=$CI_PROJECT_DIR/android/upload.jks
      storePassword=$PLAY_KEYSTORE_PASSWORD
      keyPassword=$PLAY_KEY_PASSWORD
      keyAlias=upload
      EOF
    - flutter build appbundle --release --build-number=${CI_PIPELINE_ID}
    # the flutter image's python3 has no pip module — bootstrap it first
    - python3 -m ensurepip --upgrade 2>/dev/null || { apt-get update -qq && apt-get install -y -qq python3-pip; }
    - python3 -m pip install --quiet --break-system-packages google-api-python-client google-auth
    - python3 tool/play_upload.py --package "$PLAY_PACKAGE" --aab build/app/outputs/bundle/release/app-release.aab --credentials "$PLAY_SA_JSON" --track "$PLAY_TRACK"
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 1 week

# development → internal testing (automatic on every green pipeline)
publish-internal:
  extends: .play-publish
  variables:
    PLAY_TRACK: internal
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: on_success

# main → production (automatic once main is used and the prod track is live).
# Flip `when: on_success` to `when: manual` here if you ever want a click-gate.
publish-production:
  extends: .play-publish
  variables:
    PLAY_TRACK: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success