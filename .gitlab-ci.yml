# .gitlab-ci.yml — PlantlyInventory
#
# Five stages; the first three run on every push and MR:
#   analyze → test (flutter test + lint-tools) → build (build-web + build-android)
#   → publish (Play tracks + store listing, all click-gated) → deploy (web build → inventory.plantly.ro, main only)
#
# Flutter image: ghcr.io/cirruslabs/flutter, pinned by exact tag via FLUTTER_IMAGE
# (see the note next to the variable).
# Runs on the group runner `tisa15-ct-gitlab-runner-1 (group runner, plantly-inventory)`.
#
# Followups Lazarus left for later:
#  - dart format enforcement — left out of analyze for now because 90/100 of the
#    existing files don't match dart-format defaults. Add `dart format --set-exit-if-changed .`
#    here after a one-time `dart format .` pass on the repo.
#  - JS prototype Playwright tests (npm install && npm test) — separate job with a Node image.
#  - build-ios — needs a macOS runner (none yet). build-android is wired below.
#  - container registry image build (registry.urundead.win/plantly-inventory/app) — wire when there's a deploy target.

# Branch pipelines only. Without this, a push to a branch that has an open MR
# spawns a second (merge_request_event) pipeline running the same jobs twice.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - analyze
  - test
  - build
  - publish
  - deploy

variables:
  # Pinned to an exact, existing tag so a `:stable` re-point can't silently
  # change the toolchain under a release. Verified against the ghcr tag list on
  # 2026-09-18: cirruslabs stopped publishing after 3.44.0 (Dart 3.12.0), so
  # there is no 3.47.x image; `:stable` currently resolves to this same digest.
  # 3.44.0 satisfies pubspec's `sdk: ^3.11.5` and the lockfile (>=3.11.5).
  # Bump deliberately (and re-verify the tag exists) when moving the toolchain;
  # local dev on 3.47.x is fine — the lockfile only floats SDK-pinned packages.
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:3.44.0"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  # Gradle's home must live inside the project dir to be cacheable by GitLab.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  PLAY_PACKAGE: "ro.plantly.inventory"
  # fastlane-layout store listing + changelogs (tool/play_listing.py, --release-notes-dir)
  PLAY_METADATA_DIR: "android/fastlane/metadata/android"
  # changelogs-only tree for the internal-testing track (no listing files):
  # <locale>/changelogs/default.txt — what internal testers see as "what's new".
  PLAY_INTERNAL_NOTES_DIR: "android/fastlane/metadata/internal"

default:
  image: $FLUTTER_IMAGE
  before_script:
    - flutter --version
    - flutter pub get

cache:
  key:
    files:
      - pubspec.lock
  paths:
    - .pub-cache/

analyze:
  stage: analyze
  script:
    # non-fatal on infos (e.g. framework deprecations like onReorder) so they
    # don't block delivery; warnings and errors still fail the job.
    - flutter analyze --no-fatal-infos

test:
  stage: test
  script:
    # Human-readable per-test output in the job trace. (`--machine` used to
    # override the reporter with a JSON stream, and the junit artifact it was
    # paired with is something `flutter test` never writes — dropped.)
    - flutter test --reporter=expanded

# Release tooling under tool/ (Play listing + upload scripts): unit tests with
# stdlib-only fakes, plus a --dry-run over the real store metadata so an
# over-long description or a mis-sized graphic fails every pipeline in seconds
# instead of the production publish job. No pip, no pub get.
lint-tools:
  stage: test
  needs: []
  before_script: []
  cache: []
  script:
    - python3 --version
    - python3 -m unittest discover -s tool/tests -v
    - python3 tool/play_listing.py --package "$PLAY_PACKAGE" --metadata-dir "$PLAY_METADATA_DIR" --dry-run
    # Internal-track release notes: same loader publish-internal uses (≤500 chars, ro + en-US present).
    - |
      python3 - <<'EOF'
      import os, sys; sys.path.insert(0, "tool"); import play_api, play_upload
      notes = play_api.load_release_notes(os.environ["PLAY_INTERNAL_NOTES_DIR"], 0, play_upload.LOCALE_MAP)
      langs = sorted(n["language"] for n in notes)
      assert langs == ["en-US", "ro"], f"internal release notes: expected en-US + ro, got {langs}"
      print("internal release notes ok:", ", ".join(langs))
      EOF

# Web build. Stamps PLANTLY_APP_VERSION from pubspec (User-Agent / X-Plantly-Client
# — see lib/config/plantly_hosts.dart) on every branch so the artifact is the
# same shape everywhere; on `main` this artifact is what deploy-web-prod ships
# to https://inventory.plantly.ro. Extra compile-time flags come from the
# optional project CI variable INVENTORY_WEB_DART_DEFINES (space-separated
# `--dart-define=K=V` flags, e.g. `--dart-define=PLANTLY_CLOUD_ENABLED=true`);
# unset = feature defaults (cloud OFF, sell OFF). Deliberately NOT declared as a
# job variable: a job-level default would shadow the project-level one.
build-web:
  stage: build
  script:
    - |
      APP_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
      if [ -z "$APP_VERSION" ]; then echo "build-web - could not read version: from pubspec.yaml"; exit 1; fi
      echo "build-web - PLANTLY_APP_VERSION=$APP_VERSION extra defines: ${INVENTORY_WEB_DART_DEFINES:-<none>}"
      # shellcheck disable=SC2086  # INVENTORY_WEB_DART_DEFINES is intentionally word-split
      flutter build web --release --no-web-resources-cdn \
        --dart-define=PLANTLY_APP_VERSION="$APP_VERSION" ${INVENTORY_WEB_DART_DEFINES:-}
    # Per-release URL space: everything but index.html & co. moves under
    # build/web/v/<id>/ so no browser/edge cache can serve a previous
    # release's main.dart.js/assets (Flutter names aren't hashed). id = short
    # sha + hex pipeline id: /v/<id>/ is immutable, and a new pipeline on the
    # same commit may build different bytes (other dart-defines). Must equal
    # REL_ID in ci/prod/deploy-web.sh. Also drops web/prototype/ (design
    # reference, not shipped).
    - python3 tool/web_version_assets.py build/web "${CI_COMMIT_SHORT_SHA}$(printf '%x' "$CI_PIPELINE_ID")"
    - cat build/web/version.json; echo
  artifacts:
    paths:
      - build/web/
    expire_in: 1 week

# Gradle cache shared by the Android jobs (wrapper dists, AGP/Kotlin deps).
# Keyed on the Gradle inputs, layered on top of the default pub cache.
.android-gradle-cache:
  cache:
    - key:
        files:
          - pubspec.lock
      paths:
        - .pub-cache/
    - key:
        files:
          - android/gradle/wrapper/gradle-wrapper.properties
          - android/settings.gradle.kts
      paths:
        - .gradle-home/caches/
        - .gradle-home/wrapper/

# Unsigned debug AAB on every branch/MR so Gradle/AGP/manifest/plugin breakage
# surfaces pre-merge instead of in the publish job. No key.properties → the
# build falls back to the debug keystore (see android/app/build.gradle.kts).
# Note: --debug skips R8, so proguard-rules.pro is only exercised by publish.
# No artifact on purpose: the debug AAB is ~90 MB and the job exists to
# pass/fail, not to ship; the publish jobs archive the real signed AAB.
build-android:
  stage: build
  extends: .android-gradle-cache
  rules:
    # Skipped on development/main: every change reaches them through a branch
    # pipeline that already ran this gate, and the (manual) publish jobs build
    # the same release variant signed — running it again here only doubles the
    # ~20 min Android build.
    - if: '$CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "main"'
      when: never
    - when: on_success
  script:
    # --release (unsigned → debug keystore fallback) so R8/proguard is exercised
    # pre-merge; the publish jobs build exactly this variant.
    - flutter build appbundle --release

# ─── Play delivery ──────────────────────────────────────────────────────────
# development|main → internal testing (manual); main → production (manual).
# Since 1.1.0 BOTH tracks compile Inventory Cloud + Play Billing ON (the app
# stays free; Cloud is the paid add-on). Both build a signed AAB and
# upload it via the Android Publisher API, with the per-locale "what's new"
# text from $PLAY_RELEASE_NOTES_DIR/<locale>/changelogs/ (<versionCode>.txt,
# else default.txt). The versionCode is the (globally increasing, instance-wide)
# pipeline id — one counter for BOTH tracks, so an internal build never
# outranks a later production build and nothing needs a manual pubspec bump;
# versionName comes from pubspec unless the job sets PLAY_BUILD_NAME.
# Compile-time feature flags come from INVENTORY_ANDROID_DART_DEFINES
# (space-separated `--dart-define=K=V`; see lib/config/plantly_features.dart) —
# both publish jobs set it to cloud + billing ON in their own `variables:`.
#
# Requires these PROTECTED CI/CD variables (set on the project) and PROTECTED
# development + main branches so they are only exposed to those pipelines:
#   PLAY_SA_JSON             (file)  play-publisher-inventory SA key
#   PLAY_UPLOAD_KEYSTORE_B64 (var)   base64 of the upload keystore (.jks)
#   PLAY_KEYSTORE_PASSWORD   (var)   keystore password
#   PLAY_KEY_PASSWORD        (var)   key password

# The flutter image's python3 has no pip module — bootstrap it, then the Play client.
.play-pip: &play-pip
  - python3 -m ensurepip --upgrade 2>/dev/null || { apt-get update -qq && apt-get install -y -qq python3-pip; }
  - python3 -m pip install --quiet --break-system-packages google-api-python-client google-auth google-auth-httplib2

.play-publish:
  stage: publish
  extends: .android-gradle-cache
  variables:
    # "true" = validate + push the store listing (texts + graphics) from
    # $PLAY_METADATA_DIR inside this job, BEFORE the ~25 min AAB build, so a bad
    # listing fails in seconds. The listing is app-wide (not per track).
    PLAY_PUSH_LISTING: "false"
    # Staged rollout fraction in (0,1) → `play_upload.py --rollout <fraction>`
    # (status inProgress, that share of users). Empty = `status: completed`
    # (100 %). publish-production defaults to "0.2"; override in the Run-job
    # form ("" for an immediate 100 %). Widen/finish later with
    # `tool/play_upload.py --rollout-update 0.5|complete` (README § Release) or
    # Play Console → Production → Manage rollout.
    PLAY_ROLLOUT: ""
    # Any other extra flags for tool/play_upload.py (e.g. "--status draft").
    PLAY_UPLOAD_EXTRA_ARGS: ""
    # Where the per-locale changelogs come from (default: the store-listing tree).
    PLAY_RELEASE_NOTES_DIR: "$PLAY_METADATA_DIR"
    # versionName override (`--build-name`); empty = `version:` from pubspec.yaml.
    PLAY_BUILD_NAME: ""
    # Lowest versionCode Play already holds on the production track (1.0.0 =
    # 2882). The pipeline id is monotonic, so this only trips if the project is
    # ever moved to another GitLab instance or the counter is reset.
    PLAY_VERSION_CODE_MIN: "2882"
    # INVENTORY_ANDROID_DART_DEFINES is deliberately NOT given a default here
    # (a job-level default would shadow a project-level variable). Each publish
    # job sets it in its own `variables:` (cloud + billing ON on both tracks).
  script:
    # Fail loudly here rather than deep inside Gradle if a protected var is missing/empty
    # (e.g. job ran on an unprotected ref) — build.gradle.kts would otherwise error on keystore load.
    - |
      if [ -z "$PLAY_UPLOAD_KEYSTORE_B64" ] || [ -z "$PLAY_KEYSTORE_PASSWORD" ] || [ -z "$PLAY_KEY_PASSWORD" ] || [ ! -s "$PLAY_SA_JSON" ]; then
        echo "publish - PLAY_* CI variables missing (is this a protected branch?)"; exit 1
      fi
    - |
      if [ "$CI_PIPELINE_ID" -le "$PLAY_VERSION_CODE_MIN" ]; then
        echo "publish - versionCode $CI_PIPELINE_ID would not exceed PLAY_VERSION_CODE_MIN=$PLAY_VERSION_CODE_MIN"; exit 1
      fi
      PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
      echo "publish - track=$PLAY_TRACK versionCode=$CI_PIPELINE_ID versionName=${PLAY_BUILD_NAME:-$PUBSPEC_VERSION} rollout=${PLAY_ROLLOUT:-completed} notes=$PLAY_RELEASE_NOTES_DIR dart-defines: ${INVENTORY_ANDROID_DART_DEFINES:-<none, feature defaults>}"
    - *play-pip
    - |
      if [ "$PLAY_PUSH_LISTING" = "true" ]; then
        python3 tool/play_listing.py --package "$PLAY_PACKAGE" --credentials "$PLAY_SA_JSON" --metadata-dir "$PLAY_METADATA_DIR"
      fi
    - echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > "$CI_PROJECT_DIR/android/upload.jks"
    - |
      if [ ! -s "$CI_PROJECT_DIR/android/upload.jks" ]; then
        echo "publish - keystore decode produced an empty file"; exit 1
      fi
    - |
      cat > "$CI_PROJECT_DIR/android/key.properties" <<EOF
      storeFile=$CI_PROJECT_DIR/android/upload.jks
      storePassword=$PLAY_KEYSTORE_PASSWORD
      keyPassword=$PLAY_KEY_PASSWORD
      keyAlias=upload
      EOF
    # PLANTLY_APP_VERSION stamps the User-Agent / X-Plantly-Client version with
    # the effective versionName (same as build-web does for the web build).
    # shellcheck disable=SC2086  # INVENTORY_ANDROID_DART_DEFINES is intentionally word-split
    - |
      PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
      flutter build appbundle --release --build-number=${CI_PIPELINE_ID} \
        ${PLAY_BUILD_NAME:+--build-name=$PLAY_BUILD_NAME} \
        --dart-define=PLANTLY_APP_VERSION="${PLAY_BUILD_NAME:-$PUBSPEC_VERSION}" \
        ${INVENTORY_ANDROID_DART_DEFINES:-}
    # --mapping is passed explicitly (not auto-detected) so the job FAILS if R8
    # stops producing a mapping — otherwise Play crash stacks silently go
    # obfuscated. Native symbols stay auto-detected (intermediates path is not
    # a stable AGP contract; the script warns and continues when absent).
    # shellcheck disable=SC2086  # PLAY_UPLOAD_EXTRA_ARGS is intentionally word-split
    - python3 tool/play_upload.py --package "$PLAY_PACKAGE" --aab build/app/outputs/bundle/release/app-release.aab --mapping build/app/outputs/mapping/release/mapping.txt --credentials "$PLAY_SA_JSON" --track "$PLAY_TRACK" --release-notes-dir "$PLAY_RELEASE_NOTES_DIR" ${PLAY_ROLLOUT:+--rollout "$PLAY_ROLLOUT"} $PLAY_UPLOAD_EXTRA_ARGS
  artifacts:
    paths:
      - build/app/outputs/bundle/release/app-release.aab
      # R8 mapping for this versionCode — keep it next to the AAB so a crash
      # can be retraced by hand (`retrace mapping.txt stack.txt`) if needed.
      - build/app/outputs/mapping/release/mapping.txt
    expire_in: 1 week

# development|main → internal testing (manual click-gate). The Inventory Cloud
# test build: cloud + Play Billing compiled ON, versionName
# `1.1.0-internal.<pipeline iid>`, release notes from $PLAY_INTERNAL_NOTES_DIR,
# rolled out to 100 % of the internal testers list (status completed). Flip the
# flags for one run by overriding INVENTORY_ANDROID_DART_DEFINES in the Run-job
# form (empty string = feature defaults). `resource_group` serialises uploads so
# two clicks never race on the same Play edit. Playbook: README § Internal
# testing. `allow_failure: true` keeps the pending manual job from marking the
# pipeline "blocked".
publish-internal:
  extends: .play-publish
  resource_group: play-upload
  variables:
    PLAY_TRACK: internal
    PLAY_BUILD_NAME: "1.1.0-internal.${CI_PIPELINE_IID}"
    PLAY_RELEASE_NOTES_DIR: "$PLAY_INTERNAL_NOTES_DIR"
    INVENTORY_ANDROID_DART_DEFINES: "--dart-define=PLANTLY_CLOUD_ENABLED=true --dart-define=PLANTLY_PLAY_BILLING_ENABLED=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# main → production: click-gated. A green main pipeline stages the job; a
# human presses Play in the pipeline view to ship to the production track.
# The job pushes the store listing first (fails fast on validation), then
# builds with Inventory Cloud + Play Billing ON (since 1.1.0 — same flags as
# publish-internal) and uploads with release notes as a STAGED rollout to 20 %
# of users (PLAY_ROLLOUT="0.2"; set it to "" in the Run-job form for an
# immediate 100 %). Widen/finish: `tool/play_upload.py --rollout-update` or
# Play Console. `resource_group` serialises it with publish-internal so two
# uploads never race on the same Play edit.
# Until the app is published Play only accepts draft releases: on "Only releases
# with status draft may be created on draft app" play_upload.py re-stages the
# release as a draft in the same edit and commits again (no rebuild needed);
# then click "Send for review" in Play Console.
# `allow_failure: true` keeps a pending manual job from leaving main "blocked".
publish-production:
  extends: .play-publish
  resource_group: play-upload
  variables:
    PLAY_TRACK: production
    PLAY_PUSH_LISTING: "true"
    PLAY_ROLLOUT: "0.2"
    INVENTORY_ANDROID_DART_DEFINES: "--dart-define=PLANTLY_CLOUD_ENABLED=true --dart-define=PLANTLY_PLAY_BILLING_ENABLED=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# development → store listing only (manual): push texts + graphics from
# $PLAY_METADATA_DIR without building or shipping an AAB. Same app-wide
# listing as production sees (Play has one listing per app, not per track);
# for an unpublished app it updates the draft. No Gradle, no pub get.
publish-listing:
  stage: publish
  needs: []
  before_script: []
  cache: []
  script:
    - |
      if [ ! -s "$PLAY_SA_JSON" ]; then
        echo "publish-listing - PLAY_SA_JSON missing (is this a protected branch?)"; exit 1
      fi
    - *play-pip
    - python3 tool/play_listing.py --package "$PLAY_PACKAGE" --credentials "$PLAY_SA_JSON" --metadata-dir "$PLAY_METADATA_DIR"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: manual
      allow_failure: true

# ─── Web delivery ───────────────────────────────────────────────────────────
# main → https://inventory.plantly.ro (static files on the plantly-prod host,
# served by its Caddy; see ci/prod/deploy-web.sh and the quadlets repo
# plantly-prod/README.md § Inventory web). Automatic on main like the
# marketplace frontend's deploy-prod — no click gate — but only materialises
# when the protected ssh variables exist, so a repo without them (fork, or
# before first-time setup) simply has no deploy job. Needs only build-web;
# build-web has no `needs:` of its own, so stage order still makes it (and
# therefore this job) wait for analyze + test.
#
# Requires these PROTECTED CI/CD variables (same values as plantly.ro/web/frontend):
#   PROD_DEPLOY_SSH_KEY  (file)  ssh key for $PROD_SSH_USER@$PROD_SSH_HOST (sudo on the host)
#   PROD_SSH_HOST        (var)   plantly-prod LAN address
#   PROD_SSH_USER        (var)   deploy user
#   DEPLOY_LEDGER_TOKEN  (var)   GitLab PAT (api, quadlets project 34) for the DEPLOYED.md ledger
# Optional: INVENTORY_WEB_VERIFY_URL (public base URL to probe; "skip" disables).
deploy-web-prod:
  stage: deploy
  needs: ["build-web"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_SSH_HOST && $PROD_SSH_USER'
  resource_group: prod-deploy
  environment:
    name: production-inventory-web
    url: https://inventory.plantly.ro
  timeout: 15m
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash openssh-client curl python3 tar
  cache: []
  script:
    - |
      if [ ! -s "$PROD_DEPLOY_SSH_KEY" ]; then
        echo "deploy-web-prod - PROD_DEPLOY_SSH_KEY missing (is this a protected branch?)"; exit 1
      fi
    - bash ci/prod/deploy-web.sh
